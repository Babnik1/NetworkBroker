name: PR Checker

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install tools and Conan
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen
        pip install "conan<2.0"

    - name: Build project
      run: make all

    - name: Run tests
      run: ctest --test-dir build --output-on-failure